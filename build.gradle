plugins {
    id 'java-library'
    id 'groovy'
    id 'maven-publish'
    id 'jacoco'
}

group = 'no.fint'
version = providers.gradleProperty('version').getOrElse('4.0.0-SNAPSHOT')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

publishing {
    repositories {
        maven {
            url = uri('https://repo.fintlabs.no/releases')
            credentials {
                username = System.getenv("REPOSILITE_USERNAME")
                password = System.getenv("REPOSILITE_PASSWORD")
            }
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

dependencies {
    api platform('org.springframework.boot:spring-boot-dependencies:4.1.2')
    api 'tools.jackson.core:jackson-databind'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor platform('org.springframework.boot:spring-boot-dependencies:4.1.2')
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.slf4j:slf4j-api'

    testImplementation 'org.spockframework:spock-core:2.4-groovy-5.0'
    testImplementation 'org.apache.groovy:groovy-json'
    testImplementation 'org.springframework.boot:spring-boot-starter-jackson'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

javadoc {
    options.windowTitle = 'FINT Event Model'
    options.encoding = 'UTF-8'
    destinationDir = file('./javadocs/')
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

jacoco {
    toolVersion = '0.8.16'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.95
            }
            limit {
                counter = 'BRANCH'
                minimum = 0.90
            }
        }
    }
}

check {
    dependsOn jacocoTestReport, jacocoTestCoverageVerification
}
